name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          GOBIN=$PWD/bin go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          ./bin/staticcheck ./...

      - name: Test local transport behavior
        run: go test -race ./... -skip '^(TestPing|TestPingWithCustomDialer|TestDial|TestDialWithCustomDialer|ExamplePing)$'

      - name: Build
        run: go build -o raknet_exe -v .
